name: ouch
base: core26
version: '0.8.3'
title: Ouch
summary: Painless compression and decompression in the terminal
description: |
  Ouch compresses, decompresses and lists archives with simple commands.
  The format is detected from the file extension.

  **Examples**

     ouch compress ./my-dir ./my-dir.tar.zst
     ouch decompress ./my-dir.tar.zst
     ouch list ./my-dir.tar.zst

  **File access**

  Ouch can use files in your home directory. To also use USB drives and
  other removable media (/media, /mnt), run:

     sudo snap connect ouch:removable-media
license: MIT
grade: stable
confinement: strict
website: https://github.com/ouch-org/ouch
source-code:
  - https://github.com/ouch-org/ouch
  - https://github.com/sidalit/ouch-snap
issues:
  - https://github.com/ouch-org/ouch/issues
  - https://github.com/sidalit/ouch-snap/issues
contact: https://github.com/sidalit/ouch-snap/issues

platforms:
  amd64:
  arm64:
  armhf:
  ppc64el:
  riscv64:
  s390x:

apps:
  ouch:
    command: bin/ouch
    completer: share/bash-completion/completions/ouch
    plugs: [home, removable-media]

parts:
  ouch:
    plugin: rust
    source: https://github.com/ouch-org/ouch.git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    rust-channel: '1.93.0'
    build-packages:
      - build-essential
      - clang
      - libclang-dev
      - cmake
      - pkg-config
    build-environment:
      - OUCH_ARTIFACTS_FOLDER: $CRAFT_PART_BUILD/artifacts
    override-build: |
      craftctl default
      install -Dm644 artifacts/ouch.bash "$CRAFT_PART_INSTALL/share/bash-completion/completions/ouch"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/share/doc/ouch/LICENSE"
      # The default "unrar" feature bundles the UnRAR library, under its own license.
      unrar_license="$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -path '*/unrar-ng-sys-*/vendor/unrar/license.txt' | head -n1)"
      install -Dm644 "$unrar_license" "$CRAFT_PART_INSTALL/share/doc/ouch/LICENSE.UnRAR"
